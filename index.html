<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Node Labs - Editor</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Essential layout styles to ensure full screen canvas */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        #canvas-container { width: 100%; height: 100%; position: relative; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; } /* touch-action: none is critical for custom pinch-zoom */
        
        /* New UI Elements */
        #top-nav {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .nav-btn {
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
            border: 1px solid #555;
        }
        .nav-btn:hover { background: #444; }

        #viewerModeBanner {
            display: none;
            background: #ff9800;
            color: black;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-family: sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #sidebar {
            position: absolute;
            top: 60px;
            left: 15px;
            width: 250px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            color: white;
            z-index: 90;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="top-nav">
        <a href="main.html" class="nav-btn">← Main Menu</a>
        <div id="viewerModeBanner">VIEWER MODE (Read-Only)</div>
    </div>

    <div id="sidebar">
        <h3>Node Library</h3>
        <p>Click to add to center of screen:</p>
        <button onclick="addNode('mixer')">Add Audio Mixer</button>
        <button onclick="addNode('switch')">Add Network Switch</button>
        </div>

    <div id="canvas-container">
        <canvas id="nodeCanvas"></canvas>
    </div>

    <script src="js/componentLibrary.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
